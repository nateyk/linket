name: linket
type: laravel
docroot: public
php_version: "8.4"
database:
  type: mysql
  version: "8.0"
# jsdom 30 (vitest DOM environment) requires Node >=22.22.2 — Node 20 makes
# every DOM test worker die with "webidl.util.markAsUncloneable is not a function".
nodejs_version: "24"
# Expose Vite/Storybook so Windows browsers can reach container-bound servers.
web_extra_exposed_ports:
  - name: vite
    container_port: 5173
    http_port: 5173
    https_port: 5174
  - name: storybook
    container_port: 6006
    http_port: 6006
    # Avoid 6007: Cursor on Windows often binds it and Traefik returns "No Route Found".
    https_port: 6008
hooks:
  post-start:
    - exec: composer install --no-interaction --prefer-dist
    # Avoid config:cache here: a cached config locks DB_* to .env and ignores
    # APP_ENV=testing / .env.testing (tests would hit `db` instead of `db_test`).
    - exec: php artisan config:clear
    - exec: php artisan event:cache
