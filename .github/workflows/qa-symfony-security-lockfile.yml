name: Generate reviewed Symfony security lockfile

on:
  push:
    branches: [qa/security-symfony-lockfile-20261105]
    paths: ['.github/workflows/qa-symfony-security-lockfile.yml']

permissions:
  contents: write

jobs:
  composer-lock:
    name: Resolve and commit audited Symfony lockfile to isolated QA branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout synthetic QA branch
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: PHP 8.4 and Composer v2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, gd, zip, bcmath, exif, redis, curl, openssl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Resolve only affected Symfony packages
        shell: bash
        env:
          COMPOSER_AUDIT_ABANDONED: ignore
          COMPOSER_MEMORY_LIMIT: '-1'
        run: |
          set -euo pipefail
          composer update \
            symfony/filesystem symfony/html-sanitizer symfony/http-client \
            symfony/http-foundation symfony/http-kernel symfony/routing \
            symfony/serializer symfony/yaml \
            --with-all-dependencies --no-install --no-plugins --no-scripts \
            --no-interaction --no-progress
          git diff --exit-code -- composer.json
          git diff --stat -- composer.lock

      - name: Confirm patched Symfony versions
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            $lock = json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR);
            $packages = array_column($lock["packages"], null, "name");
            foreach (["filesystem","html-sanitizer","http-client","http-foundation","http-kernel","routing","serializer","yaml"] as $name) {
              $package = $packages["symfony/".$name] ?? null;
              if (!$package) {fwrite(STDERR, "Missing Symfony package: ".$name."\n"); exit(1);}
              $version = ltrim($package["version"], "v");
              $safe = (str_starts_with($version, "7.4.") && version_compare($version, "7.4.23", ">="))
                    || (str_starts_with($version, "8.1.") && version_compare($version, "8.1.11", ">="))
                    || (str_starts_with($version, "6.4.") && version_compare($version, "6.4.50", ">="));
              echo "symfony/".$name." ".$version.($safe ? " PATCHED" : " UNSAFE")."\n";
              if (!$safe) exit(1);
            }
          '

      - name: Audit production locked dependencies without bypasses
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --no-dev --no-interaction --format plain | tee composer-audit.txt

      - name: Commit verified lockfile only to disposable QA branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/qa/security-symfony-lockfile-20261105' ]]
          printf '%s  %s\n' 'c8b13014da5329943da4c931524ba4802aed2c2dec30133a805976c59610a09e' 'composer.lock' | sha256sum --check
          git diff --exit-code -- composer.json
          if git diff --quiet -- composer.lock; then
            echo 'Audited lockfile already matches QA branch'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- composer.lock
          [[ "$(git diff --cached --name-only)" == 'composer.lock' ]]
          git commit -m 'fix(deps): apply security-patched Symfony lockfile'
          git push origin HEAD:refs/heads/qa/security-symfony-lockfile-20261105

      - name: Upload proposed lockfile and audit log for review only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: symfony-security-lockfile
          path: |
            composer.lock
            composer-audit.txt
          if-no-files-found: error
          retention-days: 3
