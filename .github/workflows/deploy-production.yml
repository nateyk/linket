name: Deploy Production
on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Exact main commit SHA
        required: true
        type: string
      confirm_production:
        description: Type DEPLOY
        required: true
        type: string
concurrency:
  group: production-deploy
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  resolve:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: runzumi-ubuntu-24.04-x64-4
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
      artifact_name: ${{ steps.ci.outputs.artifact_name }}
      release_id: ${{ steps.id.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve successful exact-main CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.deploy_sha }}
          CONFIRM: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == DEPLOY ]] || exit 1
          bash scripts/release/resolve-verified-ci.sh "$SHA"
      - name: Build release ID
        id: id
        env:
          SHA: ${{ steps.ci.outputs.sha }}
        run: |
          SHORT="${SHA:0:7}"
          echo "release_id=$(date -u +%Y%m%d-%H%M%S)-$SHORT" >> "$GITHUB_OUTPUT"
  deploy:
    if: github.ref == 'refs/heads/main' && needs.resolve.result == 'success'
    needs: resolve
    runs-on: runzumi-ubuntu-24.04-x64-4
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Revalidate approved CI after human approval
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          RUN_ID: ${{ needs.resolve.outputs.ci_run_id }}
        run: |
          set -euo pipefail
          f="$(mktemp)"
          trap 'rm -f "$f"' EXIT
          GITHUB_OUTPUT="$f" bash scripts/release/resolve-verified-ci.sh "$SHA"
          grep -Fxq "ci_run_id=$RUN_ID" "$f"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.artifact_name }}
          run-id: ${{ needs.resolve.outputs.ci_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: artifact
      - name: Validate exact CI release bytes
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          a=(artifact/*.tar.gz)
          [[ ${#a[@]} -eq 1 ]] || exit 1
          bash deploy/verify-release-artifact.sh "${a[0]}" "$SHA"
          echo "ARTIFACT_FILE=${a[0]}" >> "$GITHUB_ENV"
          echo "ARTIFACT_BASE=$(basename "${a[0]}")" >> "$GITHUB_ENV"
      - name: Pinned SSH connection
        env:
          KEY: ${{ secrets.CPANEL_SSH_KEY }}
          KNOWN: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          HOST: ${{ vars.CPANEL_SSH_HOST }}
          PORT: ${{ vars.CPANEL_SSH_PORT }}
          USERNAME: ${{ vars.CPANEL_SSH_USER }}
        run: |
          set -euo pipefail
          [[ -n "$KEY" && -n "$KNOWN" ]] || exit 1
          [[ "$HOST" =~ ^[A-Za-z0-9.-]+$ ]] || exit 1
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]] || exit 1
          [[ "$USERNAME" =~ ^[A-Za-z0-9_.-]+$ ]] || exit 1
          mkdir -p ~/.ssh/cm
          chmod 700 ~/.ssh ~/.ssh/cm
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host cpanel
            HostName $HOST
            Port $PORT
            User $USERNAME
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ControlMaster auto
            ControlPath ~/.ssh/cm/%r@%h:%p
            ControlPersist 15m
          CONFIG
          chmod 600 ~/.ssh/config
          ssh -MNf cpanel
      - name: Transfer checked artifact and server verifier
        run: |
          set -euo pipefail
          ssh cpanel 'mkdir -p ~/linket/releases ~/linket/deploy'
          scp "$ARTIFACT_FILE" "${ARTIFACT_FILE}.sha256" 'cpanel:~/linket/releases/'
          scp deploy/deploy.sh deploy/verify-release-artifact.sh 'cpanel:~/linket/deploy/'
          ssh cpanel 'chmod +x ~/linket/deploy/deploy.sh ~/linket/deploy/verify-release-artifact.sh'
      - name: Deploy exact approved release
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
          PHP_BIN: ${{ vars.PHP_BINARY }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          PHP_BIN="${PHP_BIN:-php}"
          [[ -n "$APP_URL" ]] || exit 1
          printf -v command 'DEPLOY_PATH="$HOME/linket" PHP_BINARY=%q APP_URL=%q bash "$HOME/linket/deploy/deploy.sh" --release-id=%q --artifact=%q --expected-sha=%q --php-binary=%q --health-url=%q --keep-releases=5' "$PHP_BIN" "$APP_URL" "$RELEASE_ID" "releases/$ARTIFACT_BASE" "$SHA" "$PHP_BIN" "${APP_URL%/}/up"
          ssh cpanel "$command"
      - name: Post-deploy public health
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 5 --max-time 15 "${APP_URL%/}/up"
