name: CI

on:
  pull_request:
    branches: [main]
  push:
    # One verified build of each main commit; feature PRs use pull_request.
    branches: [main]
  # Verify an isolated branch manually before opening a PR when needed.
  workflow_dispatch:

# Cancel obsolete CI work per event and PR/branch. Production deployment has
# its own separate, non-cancelling concurrency group.
concurrency:
  # Move to a fresh concurrency namespace after a cancelled legacy verify join
  # remained queued and blocked the current PR. Keep cancellation for future SHAs.
  group: ci-v2-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify changed files
    runs-on: runzumi-ubuntu-24.04-x64-8
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_php: ${{ steps.scope.outputs.run_php }}
      run_node: ${{ steps.scope.outputs.run_node }}
    steps:
      # Keep this required workflow running even for docs-only PRs: GitHub
      # may leave required checks pending when the entire workflow is skipped
      # using on.pull_request.paths-ignore.
      - name: Choose safe verification scope
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Main must ALWAYS build its deployable artifact. A manually
          # dispatched run also verifies everything.
          if [[ "$EVENT_NAME" != 'pull_request' ]]; then
            printf 'run_php=true\nrun_node=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # GitHub CLI is preinstalled on github-hosted Ubuntu runners.
          # --paginate covers PRs changing more than 100 files. Fail closed
          # if the API fails: never silently declare code changes docs-only.
          files="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename')"
          run_php=false
          run_node=false
          if [[ -z "$files" ]]; then
            run_php=true
            run_node=true
          else
            while IFS= read -r file; do
              case "$file" in
                # Docs-only patterns are intentionally narrow so MDX or
                # Markdown imported by application code is not missed.
                docs/*|README.md|CHANGELOG.md|CONTRIBUTING.md|SECURITY.md|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md)
                  ;;
                # PHP/server-only changes (Composer is deliberately separate).
                *.php|composer.json|composer.lock|phpunit.xml|database/*)
                  run_php=true
                  ;;
                # Only known frontend paths are safe to treat as Node-only.
                resources/client/*|resources/scripts/*|tests/js/*|common/foundation/resources/client/*|modules/*/resources/client/*|package.json|package-lock.json|vite.config.ts|tsconfig.json|tsconfig.*.json)
                  run_node=true
                  ;;
                # Any ambiguous file can affect both systems. In particular,
                # other scripts, YAML, env, config, and workflow changes run both.
                *)
                  run_php=true
                  run_node=true
                  ;;
              esac
            done <<< "$files"
          fi
          printf 'run_php=%s\nrun_node=%s\n' "$run_php" "$run_node" >> "$GITHUB_OUTPUT"
          echo "Verification scope: PHP=$run_php, Node=$run_node"

  php:
    name: PHP tests and security (8.4 / MySQL 8.0)
    needs: changes
    if: ${{ needs.changes.outputs.run_php == 'true' }}
    runs-on: runzumi-ubuntu-24.04-x64-8
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: belink_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, gd, zip, bcmath, exif, redis, curl, openssl, fileinfo
          coverage: none
          tools: composer:v2

      # The old hardcoded ~/.composer/cache/files did not exist on Ubuntu;
      # successful prior runs reported a cache Path Validation Error.
      - name: Discover real Composer download cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer package archives (not vendor)
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php84-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php84-composer-

      - name: Create synthetic test environment (no production credentials)
        shell: bash
        run: |
          set -euo pipefail
          cp env.example .env
          sed -i 's/^INSTALLED=.*/INSTALLED=true/' .env
          grep -q '^INSTALLED=true' .env || echo 'INSTALLED=true' >> .env
          echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> .env
          cat >> .env <<'EOF'
          APP_ENV=testing
          APP_DEBUG=false
          APP_URL=http://localhost
          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          SCOUT_DRIVER=null
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=belink_test
          DB_USERNAME=root
          DB_PASSWORD=root
          REDIS_HOST=127.0.0.1
          MAIL_MAILER=array
          EOF
          ! grep -q 'CHASECK_TEST' .env || { echo 'Unexpected payment test key in CI env'; exit 1; }

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_AUDIT_ABANDONED: ignore

      - name: Ensure APP_KEY
        run: php artisan key:generate --force

      - name: Wait until MySQL accepts an authenticated connection
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -proot \
              -N -e 'SELECT 1' belink_test >/dev/null 2>&1; then
              echo 'MySQL is ready'
              exit 0
            fi
            sleep 2
          done
          echo 'MySQL did not become ready' >&2
          exit 1

      - name: Migrate isolated test database
        run: php artisan migrate --force --no-interaction

      - name: Seed required defaults
        run: php artisan db:seed --force --no-interaction

      - name: Seed upload backends
        run: php artisan db:seed --class="Common\\Database\\Seeders\\UploadBackendsSeeder" --force --no-interaction

      # Preserve mandatory fail-closed deployment/security regressions.
      - name: Release-control security regression gates
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/tests/test-release-artifact.sh
          bash scripts/tests/test-resolve-verified-ci.sh
          bash scripts/tests/test-release-gates.sh

      - name: PHP tests - zero failures required
        run: php artisan test --compact

      - name: Validate Laravel deploy caches
        shell: bash
        run: |
          set -euo pipefail
          php artisan config:cache
          php artisan route:cache
          php artisan event:cache
          php artisan view:cache
          php artisan optimize
          php artisan optimize:clear

      - name: Verify scheduler and API documentation
        shell: bash
        run: |
          set -euo pipefail
          php artisan schedule:list
          bash scripts/check-api-docs-drift.sh

      - name: Audit production Composer dependencies
        run: composer audit --no-dev --no-interaction --format plain

      - name: Verify route registration (avoid broken-pipe false failures)
        shell: bash
        run: |
          set -euo pipefail
          php artisan route:list > /tmp/linket-routes.txt
          head -n 20 /tmp/linket-routes.txt

  frontend:
    name: TypeScript, browser tests and Vite build (Node 24)
    needs: changes
    if: ${{ needs.changes.outputs.run_node == 'true' }}
    runs-on: runzumi-ubuntu-24.04-x64-8
    timeout-minutes: 20
    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node 24 with npm download cache
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: package-lock.json

      # npm ci recreates node_modules deterministically. npm's download cache
      # is faster/safer to reuse than restoring node_modules from a cache.
      - name: Install locked npm dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Create CI-safe frontend environment
        shell: bash
        run: |
          set -euo pipefail
          cp env.example .env
          cat >> .env <<'EOF'
          APP_ENV=testing
          APP_URL=http://localhost
          EOF

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      # Required: vite.config.ts enables Storybook/Vitest browser projects.
      - name: Install Playwright Chromium and system libraries
        run: npx playwright install --with-deps chromium

      - name: Run frontend tests (Vitest + Storybook browser)
        run: npm test
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'

      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=moderate

      # Explicitly advisory, matching existing policy. Run once rather than
      # twice; do not quietly pretend the current lint baseline is clean.
      - name: oxlint (advisory until repository baseline is clean)
        shell: bash
        run: |
          if npm run lint; then
            echo 'oxlint passed'
          else
            echo '::warning::oxlint found issues; existing policy is advisory'
          fi

      - name: Build production Vite assets
        run: npm run build

      - name: Verify Vite build output
        shell: bash
        run: |
          set -euo pipefail
          test -s public/build/manifest.json
          test -d public/build/assets

      # Only main push runs need to transfer frontend assets to release job.
      # Short retention limits the cost of temporary cross-job artifacts.
      - name: Transfer frontend assets for the release job (main only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v6
        with:
          name: frontend-build-${{ github.sha }}
          path: public/build/
          if-no-files-found: error
          retention-days: 1

  verify:
    # Preserve the original required GitHub branch-protection check name.
    name: Verify (PHP 8.4 + Node 24 + MySQL 8.0)
    needs: [changes, php, frontend]
    # Cancelled PR runs must not queue the final join and block newer SHA checks.
    if: ${{ always() && !cancelled() }}
    runs-on: runzumi-ubuntu-24.04-x64-8
    timeout-minutes: 2
    steps:
      - name: Enforce success of every required verification job
        shell: bash
        env:
          SCOPE: ${{ needs.changes.result }}
          RUN_PHP: ${{ needs.changes.outputs.run_php }}
          RUN_NODE: ${{ needs.changes.outputs.run_node }}
          PHP_RESULT: ${{ needs.php.result }}
          NODE_RESULT: ${{ needs.frontend.result }}
        run: |
          set -euo pipefail
          [[ "$SCOPE" == 'success' ]] || { echo 'Scope classification failed'; exit 1; }
          if [[ "$RUN_PHP" == 'true' ]]; then
            [[ "$PHP_RESULT" == 'success' ]] || { echo "PHP: $PHP_RESULT"; exit 1; }
          else
            [[ "$RUN_PHP" == 'false' && "$PHP_RESULT" == 'skipped' ]] || exit 1
          fi
          if [[ "$RUN_NODE" == 'true' ]]; then
            [[ "$NODE_RESULT" == 'success' ]] || { echo "Frontend: $NODE_RESULT"; exit 1; }
          else
            [[ "$RUN_NODE" == 'false' && "$NODE_RESULT" == 'skipped' ]] || exit 1
          fi
          echo 'All required checks passed (or were safely docs-only skipped)'

  release:
    name: Assemble SHA-locked production artifact
    # A deployable main SHA must have BOTH backend and frontend verified.
    needs: [verify, frontend]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.result == 'success' }}
    runs-on: runzumi-ubuntu-24.04-x64-8
    timeout-minutes: 15
    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup production PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, gd, zip, bcmath, exif, redis, curl, openssl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Discover Composer cache path
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Composer archives
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php84-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php84-composer-

      - name: Create synthetic environment for Composer's Laravel scripts
        shell: bash
        run: |
          set -euo pipefail
          cp env.example .env
          sed -i 's/^INSTALLED=.*/INSTALLED=true/' .env
          grep -q '^INSTALLED=true' .env || echo 'INSTALLED=true' >> .env
          echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> .env
          cat >> .env <<'EOF'
          APP_ENV=testing
          APP_DEBUG=false
          APP_URL=http://localhost
          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          SCOUT_DRIVER=null
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=belink_test
          DB_USERNAME=root
          DB_PASSWORD=root
          REDIS_HOST=127.0.0.1
          MAIL_MAILER=array
          EOF

      # Install production vendor cleanly: do not cache or ship test/dev vendor.
      - name: Install production Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
        env:
          COMPOSER_AUDIT_ABANDONED: ignore

      - name: Remove tracked or stale built assets before downloading
        run: rm -rf public/build

      - name: Download the frontend job's checked build
        uses: actions/download-artifact@v6
        with:
          name: frontend-build-${{ github.sha }}
          path: public/build

      - name: Verify downloaded build
        shell: bash
        run: |
          set -euo pipefail
          test -s public/build/manifest.json
          test -d public/build/assets
          test -f vendor/autoload.php

      # Preserve the EXACT archive naming, SHA metadata, checksum, and artifact
      # name used by deploy-production.yml and resolve-verified-ci.sh.
      - name: Assemble release artifact
        shell: bash
        run: |
          set -euo pipefail
          SHA="$GITHUB_SHA"
          SHORT="${SHA:0:7}"
          TS="$(date -u +%Y%m%d-%H%M%S)"
          RELEASE_ID="${TS}-${SHORT}"
          ARTIFACT_NAME="linket-${SHORT}-${TS}"
          echo "$SHA" > RELEASE_SHA
          echo "$RELEASE_ID" > RELEASE_ID
          date -u +%Y-%m-%dT%H:%M:%SZ > BUILD_AT
          echo "CI_SHA=$SHA" > CI_META
          echo "CI_RELEASE_ID=$RELEASE_ID" >> CI_META
          # Reuse the independently tested producer and consumer gates.
          # Never package raw storage, cached configuration or signing keys.
          bash scripts/release/build-release-artifact.sh "$PWD" "/tmp/${ARTIFACT_NAME}.tar.gz" "$SHA"
          mv "/tmp/${ARTIFACT_NAME}.tar.gz" "./${ARTIFACT_NAME}.tar.gz"
          mv "/tmp/${ARTIFACT_NAME}.tar.gz.sha256" "./${ARTIFACT_NAME}.tar.gz.sha256"
          bash deploy/verify-release-artifact.sh "${ARTIFACT_NAME}.tar.gz" "$SHA"
          cat "${ARTIFACT_NAME}.tar.gz.sha256"
          ls -lh "${ARTIFACT_NAME}.tar.gz"*
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"

      # Keep upload-artifact@v4 for the final CD artifact until the separate
      # deploy-production.yml download-artifact@v4 is upgraded together.
      - name: Upload exact CI artifact for production CD
        uses: actions/upload-artifact@v4
        with:
          name: linket-ci-${{ github.sha }}
          path: |
            ${{ env.ARTIFACT_NAME }}.tar.gz
            ${{ env.ARTIFACT_NAME }}.tar.gz.sha256
            RELEASE_SHA
            RELEASE_ID
            CI_META
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
