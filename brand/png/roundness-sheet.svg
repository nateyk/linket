<text x="40" y="76" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#737373" text-anchor="start">Stroke 24 on a 256 grid. One roundness system, three levels; everything else (proportions, spacing) held constant.</text>
<text x="206" y="88" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#212121" text-anchor="start">R0 · current</text>
